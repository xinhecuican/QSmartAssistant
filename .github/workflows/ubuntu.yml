name: ubuntu

on:
  push:
    branches: [ "master", "workflow" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# 同一分支推两次时取消旧的一次，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (Qt ${{ matrix.qt_version }} / ${{ matrix.qt_arch }})
    runs-on: ubuntu-latest
    # sherpa-onnx 是源码构建（冷启动 20-40 分钟），给足余量；
    # 真卡住了让它超时失败，比无限挂着好定位。
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠ 版本/arch 别随手改：
          #   * Qt 6.7 起 Linux 桌面包的 arch 代号从 gcc_64 变成 linux_gcc_64
          #     （下载源里模块名就是 ...addons.qtmultimedia.linux_gcc_64），
          #     写成 gcc_64 会变成"模块一个都匹配不上"。
          #   * 6.8.4 **在开源在线源里不存在**（6.8 系列只到 6.8.3），
          #     而项目里 "Qt >= 6.8.4" 那条限制只对 Windows 生效
          #     （见 CMakeLists.txt 的 if(WIN32) 分支）。
          #   * 这里取 6.12.0 = 开发机实际用的版本（D:/libs/qt/6.12/6.12.0），
          #     保证 CI 编的就是能编过的那套 Qt。
          - qt_version: 6.12.0
            qt_arch: linux_gcc_64
            # 只装真正用到的模块：
            #   qtmultimedia  —— ASR/TTS/播放器
            #   qtwebsockets  —— Hass 插件 + Server 的 WebSocket
            #   qthttpserver  —— Server 的 HTTP 层（只在单测构建里开 SERVER，
            #                    见下面 "Configure & build tests"）
            # 不需要 qtwebengine（没有 QWebEngineView）与 qtnetworkauth。
            qt_modules: "qtmultimedia qtwebsockets qthttpserver"

    env:
      BUILD_TYPE: Release
      BUILD_PATH: build
      TEST_BUILD_PATH: build-test

      # 模块组合：与 scripts/build_linux.sh 的默认值、CMakePresets.json 的
      # linux-gcc preset 保持一致（见 doc/linux.md §二）——livekit 唤醒 +
      # silero VAD + FunASR(Paraformer-q8) ASR + sherpa TTS + 进程内 ONNX NLU，
      # 无厂商私有 .so、无 Python。（ASR 自 2026-10 起默认 funasr，
      # 见 doc/funasr_cpu_edge_bench.md §10；CI 顺带验证这条新默认真的能编过。）
      #
      # NETEASE_USE_JS=ON 必须显式给：Linux 上该选项默认 OFF，会走 FetchContent
      # 拉 QCloudMusicApi C++ 源码参与构建（慢且依赖网络）。
      CMAKE_MODULES: >-
        -DWAKEUP_LIVEKIT=ON -DWAKEUP_SHERPA=OFF -DWAKEUP_DUILITE=OFF
        -DVAD_SILERO=ON -DVAD_DUILITE=OFF
        -DASR_FUN=ON -DTTS_SHERPA=ON
        -DNLU_ONNX=ON -DNLU_RASA=OFF -DNLU_BAIDU=OFF
        -DNETEASE_USE_JS=ON

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: linux
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true
          install-deps: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ---------------------------------------------------------------------
      # 缓存第三方编译产物。onnxruntime / sherpa-onnx / yaml-cpp 都装在 lib/
      # 下，而 lib/ 在 .gitignore 里 —— runner 每次都是空白的，必须重装。
      # 缓存 key 带上安装脚本的 hash：脚本改了（换版本/换地址）就自动失效。
      #
      # ⚠ 这里缓存的是"安装脚本产出的东西"，所以仓库里**不能**再入库
      #   lib/yaml-cpp 的任何文件（历史上误入库过一个 Windows 的 yaml-cpp.lib，
      #   直接导致 build_linux.sh 误判"已安装"而跳过安装）—— 详见该脚本注释。
      # ---------------------------------------------------------------------
      - name: Cache onnxruntime
        uses: actions/cache@v4
        with:
          path: lib/onnxruntime
          key: ${{ runner.os }}-onnxruntime-${{ hashFiles('scripts/install_onnxruntime.sh') }}

      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: lib/sherpa_onnx
          key: ${{ runner.os }}-sherpa-onnx-${{ hashFiles('scripts/install_sherpa_onnx.sh') }}

      # yaml-cpp 是个小静态库（编译 ~40s），但它是 configure 阶段的硬依赖，
      # 单独一个 key，便于单独失效/排查。
      - name: Cache yaml-cpp
        uses: actions/cache@v4
        with:
          path: lib/yaml-cpp
          key: ${{ runner.os }}-yaml-cpp-${{ hashFiles('scripts/install_yaml_cpp.sh') }}

      # ---------------------------------------------------------------------
      # 构建：直接用文档里的"一键构建"入口（doc/linux.md §二），而不是在这里
      # 重复一遍 cmake 参数 —— 这样 CI 顺带验证了这条路径本身：
      #   1. 缺依赖时装 lib/yaml-cpp（找不到会让 configure 直接失败）、
      #      lib/onnxruntime、lib/sherpa_onnx；
      #   2. 生成 Data/config.yaml（不覆盖已有）与 plugin_order.txt；
      #   3. cmake configure + build，并把可执行文件路径打出来。
      # --no-plugin-deploy: 跳过 linuxdeployqt（runner 上没装，也不需要打 AppImage）
      # ---------------------------------------------------------------------
      - name: Build (scripts/build_linux.sh)
        run: |
          bash scripts/build_linux.sh \
            --qt-dir "$QT_ROOT_DIR" \
            --config "$BUILD_TYPE" \
            --build-dir "$BUILD_PATH" \
            --no-plugin-deploy

      - name: Verify binary
        run: |
          test -x "$BUILD_PATH/$BUILD_TYPE/bin/QSmartAssistant" || {
            echo "QSmartAssistant not built under $BUILD_PATH/$BUILD_TYPE/bin"; ls -R "$BUILD_PATH" | head -50; exit 1; }
          file "$BUILD_PATH/$BUILD_TYPE/bin/QSmartAssistant"

      # ---------------------------------------------------------------------
      # 单测单独一个 build 目录：TEST=ON 会把 QTest 与 netease official client
      # 一起编进可执行文件，不该混进发布产物。
      #
      # -DSERVER=ON 只加在这里、不放进 CMAKE_MODULES：发布产物保持不开内置
      # HTTP/WebSocket 服务（不改变对外行为），但 serverHttp / serverWebSocket
      # 两个用例必须真的编到、跑到 —— 在此之前 Server/ 根本没参与过 CI 构建。
      # ---------------------------------------------------------------------
      - name: Configure & build tests
        run: |
          cmake -S . -B "$TEST_BUILD_PATH" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTEST=ON \
            -DSERVER=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            $CMAKE_MODULES
          cmake --build "$TEST_BUILD_PATH" -j"$(nproc)"

      # hassRegex / mcpClient / serverHttp / serverWebSocket / pluginReplySource
      # 是纯逻辑单测，不依赖 ASR/TTS/NLU 模型文件，适合放 CI。
      # （neteaseCaptcha 自 2026-10-12 起已删除：它的用例里把**真实手机号**写成了
      #   maskPhone 的输入，属于凭据泄露，连带这个 CI step 一起去掉。）
      # 同理还有下面 6 个录音/播放用例（recorderChunk / recorderLifecycle /
      # audioRingBuffer / audioBufferRaw / playlistIndexLogic / playerVolumeParse）——
      # 它们守的是 Recorder/ 四模块的边界（切块延迟一块、停录丢尾块、resize 泄漏、
      # 环形缓冲除零、上一曲变重播当前、amixer 解析失败被当成静音……），
      # 且**不需要麦克风或声卡**：这些判定已从绑死 QAudioSource / QMediaPlayer 的
      # 代码里抽成 ChunkReader、AudioRingBuffer、playlist 下标计算、amixer 音量解析
      # 这类纯函数，测试用自带的 FakeAudioDevice 喂数据（offscreen 下可跑）。
      # 在此之前它们只在本机跑，回归没人看住。
      # asrFun（默认 ASR 的用例；切到 -DASR_SHERPA=ON 时是 asrSherpa）/ ttsSherpa /
      # vad 需要先下载模型到运行期 Data 目录（funasr 是 230MB：
      # python3 scripts/setup.py --only funasr-asr），在 runner 上属于环境依赖
      # 而非代码问题，所以只在本机跑。同理还有 conversationRoundTrip —— 它走的是
      # 「一段话 -> ONNX NLU -> 真实插件 -> TTS 文本」的完整对话链路，
      # 少了 nlu_int8.onnx（在 Release tag 上，setup.py/fetch_models 才下）会 QSKIP。
      #
      # ⚠ 一个用例一个 step，而不是"一条命令跑两个用例"：step 名与失败 annotation
      #   都能用 REST API 匿名读到，而日志不能（下载日志要 admin 权限）。拆开之后
      #   "哪个用例挂了 / 挂在哪条断言"不拿日志也能知道。封装见
      #   scripts/run_test_case.sh。
      - name: "Test: hassRegex"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh hassRegex "$TEST_BUILD_PATH"

      - name: "Test: mcpClient"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh mcpClient "$TEST_BUILD_PATH"

      - name: "Test: serverHttp"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh serverHttp "$TEST_BUILD_PATH"

      - name: "Test: serverWebSocket"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh serverWebSocket "$TEST_BUILD_PATH"

      - name: "Test: pluginReplySource"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh pluginReplySource "$TEST_BUILD_PATH"

      # 网易云短信验证码的纯逻辑用例（neteaseCaptcha）已删除 —— 它的 maskPhone
      # 断言里用了真实手机号，属于凭据泄露；判定逻辑本身仍在 captchaflow.h 里被
      # 生产代码使用（neteasemusic.cpp），只是不再有单测守护。

      # ---------------------------------------------------------------------
      # Recorder / Player 的 6 个纯逻辑用例。全部只依赖 QtCore/QtMultimedia 的
      # 类型定义，不打开任何真实音频设备，因此可以放心放进 CI。
      # ---------------------------------------------------------------------
      # 切块边界：`bytesAvailable >= chunkSize` 才算够一块。写成 `>` 会让
      # "刚好一块"永远不发（恒定延迟一块），停录时还会丢掉不足一块的尾巴。
      - name: "Test: recorderChunk"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh recorderChunk "$TEST_BUILD_PATH"

      # Recorder 生命周期：反复 startRecord() 不能累积 readyRead 连接
      # （否则启停 N 次，同一块数据就被回调 N 次）；chunkSize<=0 不得死循环；
      # 没有输入设备时构造阶段就要收手，不能留一个空指针等着后面解引用。
      - name: "Test: recorderLifecycle"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh recorderLifecycle "$TEST_BUILD_PATH"

      # 环形缓冲：resize 必须先释放旧块（旧实现只 new[] 不 delete[]，每次泄漏）；
      # size==0 不得取模除零；写不下时返回实际写入量而不是静默截断。
      - name: "Test: audioRingBuffer"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh audioRingBuffer "$TEST_BUILD_PATH"

      # AudioBuffer 的内存播放：构造必须真的 open()（只 setOpenMode 时
      # isOpen() 为假，一个字节都读不出）；start(QByteArray) 必须置 isFinish，
      # 否则 atEnd() 永假、状态永远停在 Playing。
      - name: "Test: audioBufferRaw"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh audioBufferRaw "$TEST_BUILD_PATH"

      # 播放列表下标：playPrevious 曾经操作的是列表元素副本 ——
      # "上一曲"实际会把当前这首重播一遍；index==0 时还会取到 list[-1]。
      - name: "Test: playlistIndexLogic"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh playlistIndexLogic "$TEST_BUILD_PATH"

      # amixer 音量解析：解析失败原本会静默变成 0，把"读不出来"误判成
      # "用户把音量调到静音"；方括号里的 `46%` 还要剥掉 %。
      - name: "Test: playerVolumeParse"
        env:
          QSA_SOURCE_DIR: ${{ github.workspace }}
          QSA_PYTHON: python3
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run_test_case.sh playerVolumeParse "$TEST_BUILD_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QSmartAssistant-${{ matrix.qt_version }}-${{ matrix.qt_arch }}
          path: ${{ env.BUILD_PATH }}/${{ env.BUILD_TYPE }}/bin/
          # 产物为空说明"构建成功了但其实什么都没产出"，必须当失败处理
          if-no-files-found: error
