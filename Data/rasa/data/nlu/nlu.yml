# ===========================================================================
# 延时 / 定时 —— time 槽位（d）在开关类意图上的用法
#
# 语义：d 在这两个意图上表示**执行前的等待时长**（或绝对时刻），
#       归一化后就是传给 HA 脚本 duration 变量的秒数
#       （Data/default_config.json 的 OPEN_FURNITURE 里 `"duration": "{time|--}"`）。
#
# ⚠ 实体跨度**刻意不含尾部的「后」**：
#   jieba 会把「后开」「后关」粘成一个 token
#   （实测 `20分钟后开一下空调` -> 20|分钟|后开|一下|空调），
#   跨度只要跨过这个粘连边界，rasa 就会 WARNING 并**静默丢弃**整条标注。
#   把「后」留在实体外，边界永远落在 jieba 的干净切分点上。
#   归一化器对含「后」与不含「后」两种写法都能处理
#   （Utils/TimeNormalizer.cpp 会先剥掉尾缀 后/之后/以后/以内）。
# ===========================================================================
- intent: OPEN_FURNITURE
  examples: |
    - [30分钟](time)后打开[热水器](furniture)
    - [20分钟](time)后开启[客厅]{"entity":"location","role":"home"}的[灯](furniture)
    - [半小时](time)后打开[空调](furniture)
    - [一个小时](time)后把[电风扇](furniture)打开
    - 等[十分钟](time)后打开[卧室]{"entity":"location","role":"home"}的[灯](furniture)
    - [5分钟](time)后帮我打开[热水器](furniture)
    - [明天早上8点](time)打开[热水器](furniture)
- intent: CLOSE_FURNITURE
  examples: |
    - [30分钟](time)后关掉[热水器](furniture)
    - [20分钟](time)后关上[客厅]{"entity":"location","role":"home"}的[灯](furniture)
    - [半小时](time)后关闭[空调](furniture)
    - [两个小时](time)后把[电风扇](furniture)关掉
    - 等[十分钟](time)后关闭[厨房]{"entity":"location","role":"home"}的[灯](furniture)
    - [5分钟](time)后帮我关掉[热水器](furniture)
    - [明天早上8点](time)关掉[热水器](furniture)
