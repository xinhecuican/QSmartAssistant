    #   边界集合是 {0,1,3}，实体的 start=2 不在里面 → rasa 判定标注错位，
    #   **静默丢掉这个实体**。下面改成能对齐的说法（工具见 check_entity_alignment.py）。
    - 把[灯](furniture)打开
    - [门](furniture)打开
    - 把[热水器](furniture)打开
