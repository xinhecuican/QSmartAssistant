version: "3.1"
nlu:
- regex: number
  examples: |
    - (?:百分之)?(?:[一二三四五六七八九十百千万亿零壹贰叁肆伍陆柒捌玖拾佰仟0123456789]+(?:\.\d+)?|\d+(?:\.\d+)?)(?:%|)
# ===========================================================================
# 原始语料（保持原样）
# ===========================================================================
- intent: CHANGE_VOL
  examples: |
    - [增大](trend)音量
    - 获得当前音量
    - 调节当前音量至[50](number)\%
    - 调节音量至[百分之七十](number)
    - 调节音量至[百分之五十](number)
    - [增大](trend)当前音量
    - [减小](trend)当前音量
    - [减小](trend)音量
    - 音量[小](trend)一点
    - 音量[大](trend)一点
    - 把音量[调大](trend)一点
    - 把音量[调小](trend)一点
    - 当前音量[增大](trend)[20]\%
    - 当前音量[减小](trend)[百分之三十](number)
    - [增大](trend)当前音量到[百分之九十](number)
    - 音量调节至[百分之四十五](number)
    - 音量[增大](trend)[25](number)\%
- intent: MUSICINFO
